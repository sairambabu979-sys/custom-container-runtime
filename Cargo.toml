[workspace]
resolver = "3"
members = ["crates/*", "bins/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/sairambabu979-sys/custom-container-runtime"
publish = false

[workspace.dependencies]
# Internal crates. The dependency direction is strictly downward:
#   bins -> hull-runtime -> hull-spec -> hull-fs -> hull-sys
hull-sys = { path = "crates/hull-sys" }
hull-fs = { path = "crates/hull-fs" }
hull-spec = { path = "crates/hull-spec" }
hull-runtime = { path = "crates/hull-runtime" }
hull-testkit = { path = "crates/hull-testkit" }

# Third-party crates. Every entry is justified in docs/DEPENDENCIES.md.
bitflags = "2"
clap = { version = "4", features = ["derive", "env"] }
libc = "0.2"
oci-spec = { version = "0.10", default-features = false, features = ["runtime"] }
rustix = { version = "1.1", features = ["fs", "mount", "process", "thread", "system", "net", "event", "stdio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json", "std"] }

[workspace.lints.rust]
# Crates opt back in with `#![allow(unsafe_code)]`. Only hull-sys does.
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"
# Pedantic lints that hurt readability more than they help in this codebase.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
# A panic in the post-clone3 child must never unwind into code that belongs to the parent.
panic = "abort"
strip = "symbols"

[profile.dev]
# The child of clone3 catches unwinds explicitly, so dev builds can keep unwinding (and backtraces).
panic = "unwind"
